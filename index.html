<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Item Card</title>

    <style>
        :root {
            --bg: #3E2525;
            --surface: #B89595;
            --surface-active: #765454;
            --text: #111111;
            --accent: #D32F2F;
        }

        body {
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: Inter, Arial, sans-serif;
            box-sizing: border-box;
        }

        .cart-card {
            background: var(--surface);
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            width: 100%;
            max-width: 580px;
            border-radius: 16px;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            transition: 0.3s ease;
        }

        .cart-card.active {
            background: var(--surface-active);
            color: #ffffff;
        }

        .cart-card__image {
            width: 72px;
            height: 72px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .cart-card__info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .cart-card__title {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .cart-card__price {
            margin: 0;
            font-size: 14px;
            font-weight: 500;
            color: #555555;
        }

        .cart-card.active .cart-card__price {
            color: #ffffff;
        }

        .cart-card__controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px;
            background: #f4f4f4;
            border-radius: 8px;
        }

        .counter__btn {
            width: 28px;
            height: 28px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #111111;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .counter__btn:hover {
            background: #e4e4e4;
        }

        .counter__value {
            min-width: 24px;
            text-align: center;
            color: #111111;
            font-size: 14px;
            font-weight: 500;
        }

        .cart-card__delete {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .cart-card__delete:hover {
            color: var(--accent);
            background: rgba(211, 47, 47, 0.15);
        }

        button:focus-visible {
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }

        @media (max-width: 500px) {
            .cart-card {
                gap: 10px;
                padding: 12px;
            }

            .cart-card__image {
                width: 60px;
                height: 60px;
            }

            .cart-card__title {
                font-size: 14px;
            }

            .cart-card__controls {
                gap: 6px;
            }
        }
    </style>
</head>

<body>

<article class="cart-card">
    <img
        src="lipss.png"
        alt="Lipss Lipper Coffee Блиск для губ"
        class="cart-card__image"
    >

    <div class="cart-card__info">
        <h3 class="cart-card__title">
            Lipss Lipper Coffee Блиск для губ
        </h3>

        <p class="cart-card__price">600 ₴</p>
    </div>

    <div class="cart-card__controls">
        <div class="counter">
            <button
                type="button"
                class="counter__btn"
                id="minus"
                aria-label="Зменшити кількість"
            >
                −
            </button>

            <output
                class="counter__value"
                id="value"
                aria-label="Кількість товару"
            >
                0
            </output>

            <button
                type="button"
                class="counter__btn"
                id="plus"
                aria-label="Збільшити кількість"
            >
                +
            </button>
        </div>

        <button
            type="button"
            class="cart-card__delete"
            id="delete"
            aria-label="Видалити товар"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        </button>
    </div>
</article>

<script>
    const card = document.querySelector('.cart-card');
    const value = document.getElementById('value');
    const minus = document.getElementById('minus');
    const plus = document.getElementById('plus');
    const deleteButton = document.getElementById('delete');

    let quantity = 0;

    function updateCard() {
        value.textContent = quantity;
        card.classList.toggle('active', quantity > 0);
    }

    plus.addEventListener('click', () => {
        if (quantity < 3) {
            quantity++;
            updateCard();
        }
    });

    minus.addEventListener('click', () => {
        if (quantity > 0) {
            quantity--;
            updateCard();
        }
    });

    deleteButton.addEventListener('click', () => {
        quantity = 0;
        updateCard();
    });
</script>

</body>
</html>
